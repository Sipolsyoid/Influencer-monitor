services:
  monitor:
    build: .
    container_name: influencer-monitor
    restart: unless-stopped
    init: true                    # needed so the virtual screen (xvfb-run) starts properly
    env_file: .env
    environment:
      - TZ=Europe/Riga            # time zone for RUN_TIME
      - BROWSER=chromium
      - HEADLESS=false
      - HIDE_WINDOW=false
      - REQUEST_DELAY_SECONDS=2   # slower = fewer Instagram blocks from a data-center IP
    volumes:
      - ./data:/app/data                          # saved influencer list
      - ./reports:/app/reports                    # copies of the daily reports
      - ./browser-profile:/app/browser-profile    # browser data
      - ./instagram-session.json:/app/instagram-session.json   # Instagram login copied from your PC

  dashboard:
    build: .
    container_name: influencer-dashboard
    restart: unless-stopped
    env_file: .env                # DASHBOARD_PASSWORD
    command: ["python", "dashboard.py"]
    ports:
      - "8080:8080"               # open http://<server-ip>:8080
    volumes:
      - ./data:/app/data:ro       # read-only: the dashboard only shows what the daily scan saved
